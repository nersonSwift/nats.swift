name: ci

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  macos:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install nats-server
      run: curl --fail https://binaries.nats.dev/nats-io/nats-server/v2@latest | PREFIX='/usr/local/bin' sh
    - name: Check nats-server version
      run: nats-server -v
    - name: List schemes
      run: xcodebuild -list
    - name: Build
      run: xcodebuild build -scheme Nats -destination 'platform=macOS,arch=arm64'
    - name: Test
      run: swift test --no-parallel
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install nats-server
      run: |
        NATS_SERVER_VERSION=2.10.22
        arch="$(dpkg --print-architecture)"
        curl -sSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-${arch}.tar.gz" | tar -xz -C /tmp
        install -m 0755 "/tmp/nats-server-v${NATS_SERVER_VERSION}-linux-${arch}/nats-server" /usr/local/bin/nats-server
        nats-server --version
    - name: Build
      run: swift build
    - name: Test
      run: swift test --no-parallel
  ios:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Build
      run: xcodebuild build -scheme Nats -destination generic/platform=ios
  check-linter:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install swift-format
      run: brew install swift-format
    - name: Run check
      run: swift-format lint --configuration .swift-format -r --strict Sources Tests
